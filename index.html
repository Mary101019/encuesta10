<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta Sitios Turísticos</title>
    <!-- Carga de Bootstrap 5 desde CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Contenedor principal centrado -->
    <div class="container my-4" style="max-width: 700px;">
        
        <!-- Tarjeta simple para dar un aspecto limpio al formulario -->
        <div class="card shadow-sm p-4 rounded-3 bg-white">
            <h1 class="h3 text-center mb-4 text-primary">Encuesta de Sitios Turísticos</h1>
            
            <form action="/action_page.php" method="POST">
                
                <!-- Pregunta 1 -->
                <div class="mb-3">
                    <label for="name" class="form-label fw-bold">1. Nombres:</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Ingrese sus nombres">
                </div>

                <!-- Pregunta 2 -->
                <div class="mb-3">
                    <label for="apellido" class="form-label fw-bold">2. Apellido:</label>
                    <input type="text" id="apellido" name="apellido" class="form-control" placeholder="Ingrese su apellido">
                </div>

                <!-- Pregunta 3 -->
                <div class="mb-3">
                    <label for="direccion" class="form-label fw-bold">3. Dirección:</label>
                    <textarea id="direccion" name="direccion" class="form-control" rows="2" placeholder="Ingrese su dirección"></textarea>
                </div>

                <!-- Pregunta 4 -->
                <div class="mb-3">
                    <label for="telefono" class="form-label fw-bold">4. Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" class="form-control" placeholder="Ej. 0991234567">
                </div>

                <!-- Pregunta 5 -->
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">5. Email de contacto:</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="correo@ejemplo.com">
                </div>

                <!-- Pregunta 6 -->
                <div class="mb-3">
                    <label for="fecha" class="form-label fw-bold">6. Fecha que deseas ir:</label>
                    <input type="date" id="fecha" name="fecha" class="form-control">
                </div>

                <!-- Pregunta 7 -->
                <div class="mb-3">
                    <label for="tipo" class="form-label fw-bold">7. ¿A dónde quieres ir?</label>
                    <select id="tipo" name="tipo" class="form-select">
                        <option value="" selected disabled>Seleccione una opción</option>
                        <option value="volcan">Volcán</option>
                        <option value="laguna">Laguna</option>
                        <option value="parque">Parque</option>
                        <option value="museo">Museo</option>
                        <option value="bosque">Bosque</option>
                    </select>
                </div>

                <!-- Pregunta 8 -->
                <div class="mb-3">
                    <label class="form-label fw-bold">8. ¿Va acompañado?</label>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="acompanado" id="si" value="Sí">
                        <label class="form-check-label" for="si">Sí</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="acompanado" id="no" value="No">
                        <label class="form-check-label" for="no">No</label>
                    </div>
                </div>

                <!-- Pregunta 9 -->
                <div class="mb-3">
                    <label for="tiempo" class="form-label fw-bold">9. ¿Cuánto tiempo planea permanecer en el lugar?</label>
                    <select id="tiempo" name="tiempo" class="form-select">
                        <option value="" selected disabled>Seleccione el tiempo</option>
                        <option value="a">Menos de 2 horas</option>
                        <option value="b">Entre 2 y 4 horas</option>
                        <option value="c">Todo el día</option>
                        <option value="d">2 días y 1 noche</option>
                        <option value="e">Más tiempo</option>
                    </select>
                </div>

                <!-- Pregunta 10 -->
                <div class="mb-3">
                    <label class="form-label fw-bold">10. Servicios requeridos:</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="srv-restaurante" name="servicios[]" value="Restaurante">
                        <label class="form-check-label" for="srv-restaurante">Restaurante</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="srv-guias" name="servicios[]" value="Guias">
                        <label class="form-check-label" for="srv-guias">Guías</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="srv-hospedaje" name="servicios[]" value="Hospedaje">
                        <label class="form-check-label" for="srv-hospedaje">Hospedaje</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="srv-transporte" name="servicios[]" value="Transporte">
                        <label class="form-check-label" for="srv-transporte">Transporte</label>
                    </div>
                </div>

                <!-- Pregunta 11 -->
                <div class="mb-3">
                    <label class="form-label fw-bold">11. Actividades adicionales que deseas hacer:</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="act-senderismo" name="actividad[]" value="Senderismo">
                        <label class="form-check-label" for="act-senderismo">Senderismo</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="act-camping" name="actividad[]" value="Camping">
                        <label class="form-check-label" for="act-camping">Camping</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="act-running" name="actividad[]" value="Running">
                        <label class="form-check-label" for="act-running">Running</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="act-ciclismo" name="actividad[]" value="Ciclismo">
                        <label class="form-check-label" for="act-ciclismo">Ciclismo</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="act-fotografia" name="actividad[]" value="Fotografia">
                        <label class="form-check-label" for="act-fotografia">Fotografía</label>
                    </div>
                </div>

                <!-- Pregunta 12 -->
                <div class="mb-3">
                    <label for="presupuesto" class="form-label fw-bold">12. Presupuesto aproximado (USD):</label>
                    <input type="number" id="presupuesto" name="presupuesto" class="form-control" step="10" placeholder="Ej. 50">
                </div>

                <!-- Pregunta 13 -->
                <div class="mb-3">
                    <label class="form-label fw-bold">13. ¿Qué tipo de equipamiento o indumentaria especial trajiste para la visita?</label>
                    <div class="form-text text-muted mb-2">(Puedes marcar varias opciones)</div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="eq-ropa" name="equipamiento[]" value="ropa_termica">
                        <label class="form-check-label" for="eq-ropa">Ropa térmica / Chaqueta impermeable</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="eq-calzado" name="equipamiento[]" value="calzado_montana">
                        <label class="form-check-label" for="eq-calzado">Calzado de montaña o trekking</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="eq-sol" name="equipamiento[]" value="proteccion_solar">
                        <label class="form-check-label" for="eq-sol">Protección solar (gafas, bloqueador, sombrero)</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="eq-bastones" name="equipamiento[]" value="bastones">
                        <label class="form-check-label" for="eq-bastones">Bastones de senderismo</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="eq-agua" name="equipamiento[]" value="agua_alimentos">
                        <label class="form-check-label" for="eq-agua">Agua y alimentos de alto contenido energético</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="eq-ninguno" name="equipamiento[]" value="ninguno">
                        <label class="form-check-label" for="eq-ninguno">Ninguno / Vine con ropa casual urbana</label>
                    </div>
                </div>

                <!-- Pregunta 14 -->
                <div class="mb-4">
                    <label for="sugerencias" class="form-label fw-bold">14. Sugerencias:</label>
                    <p class="form-text text-muted mb-2">Agregue alguna actividad adicional que quiera hacer u otro comentario.</p>
                    <textarea id="sugerencias" name="message" class="form-control" rows="3" placeholder="Escriba sus sugerencias aquí..."></textarea>
                </div>

                <!-- Botón de Envío -->
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">Enviar Encuesta</button>
                </div>

            </form>
        </div>
    </div>

</body>
</html>
